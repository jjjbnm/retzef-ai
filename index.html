<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Retzef AI</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div class="layout">
 <aside class="sidebar" id="sidebar">
  <div class="side-head"><div class="brand"><span class="brand-icon">R</span><b>Retzef AI</b></div><button class="icon-btn close-side" id="closeSide">×</button></div>
  <button class="new-chat" id="newChat">＋ שיחה חדשה</button><button class="side-action" id="searchChats">⌕ חיפוש שיחות</button>
  <div class="history-title">השיחות האחרונות</div><div class="history" id="historyList"></div>
  <div class="profile-wrap"><button class="profile" id="profileOpen"><span class="profile-avatar">R</span><span class="profile-name"><b>הגדרות</b><small>התאמה אישית ותוספים</small></span><span class="profile-more">⚙</span></button></div>
 </aside>
 <div class="shade" id="shade"></div>
 <main class="main">
  <header class="topbar"><button class="icon-btn menu-btn" id="openSide">☰</button><div class="mobile-brand">Retzef AI</div><div class="top-left">Retzef AI <span class="chevron">⌄</span></div><button class="share-btn" id="shareBtn">↗ שתף</button></header>
  <section class="chat-area" id="chatArea"><div class="welcome" id="welcome"><div class="welcome-mark">R</div><h1>במה אפשר לעזור?</h1></div><div class="messages" id="messages"></div></section>
  <footer class="composer-zone"><div class="composer"><button class="plus-btn" id="attachBtn">＋</button><textarea id="messageInput" rows="1" placeholder="שאלו את Retzef AI"></textarea><button class="mic-btn" id="micBtn">♩</button><button class="send-btn" id="sendBtn" disabled>↑</button></div><div class="composer-disclaimer">Retzef AI עדיין בפיתוח. המודל העצמאי טרם חובר.</div></footer>
 </main>
</div>
<section class="settings-screen" id="settingsScreen" hidden>
 <header class="settings-top"><button class="back-btn" id="settingsBack" aria-label="חזרה">→</button><span id="settingsTopTitle">הגדרות</span><span class="top-spacer"></span></header>
 <div class="settings-scroll" id="settingsScroll">
  <div class="profile-hero"><div class="large-avatar">R<button class="edit-avatar" aria-label="עריכת תמונה">✎</button></div><h1>Retzef AI</h1><p>הגדרות Retzef AI</p></div>
  <div class="settings-content" id="settingsContent">
   <h2>My Retzef AI</h2>
   <div class="settings-group">
    <button class="setting-row" data-page="personalization"><span class="row-icon">☻</span><span>Personalization<small>התאמה אישית של Retzef AI</small></span><b>‹</b></button>
    <button class="setting-row" data-page="memory"><span class="row-icon">▤</span><span>Memory<small>זיכרונות והעדפות</small></span><b>‹</b></button>
    <button class="setting-row" data-page="plugins"><span class="row-icon">⠿</span><span>Plugins<small>חיבורים וכלים</small></span><b>‹</b></button>
   </div>
   <h2>App</h2>
   <div class="settings-group"><button class="setting-row" data-page="appearance"><span class="row-icon">◐</span><span>Appearance<small>ערכת נושא ותצוגה</small></span><b>‹</b></button><button class="setting-row" data-page="language"><span class="row-icon">文</span><span>Language<small>שפת הממשק</small></span><b>‹</b></button><button class="setting-row" data-page="about"><span class="row-icon">ⓘ</span><span>About Retzef AI<small>גרסה ומידע</small></span><b>‹</b></button></div>
   <div class="settings-search"><span>⌕</span><input id="settingsSearch" placeholder="Search settings / חיפוש בהגדרות"></div>
  </div>
  <div class="subpage" id="subpage" hidden></div>
 </div>
</section>
<div class="toast" id="toast"></div>


<script src="/app.js" defer></script>
</body></html>
