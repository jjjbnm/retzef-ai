<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Retzef AI</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div class="layout">
 <aside class="sidebar" id="sidebar">
  <div class="side-head"><div class="brand"><span class="brand-icon">R</span><b>Retzef AI</b></div><button class="icon-btn close-side" id="closeSide">×</button></div>
  <button class="new-chat" id="newChat">＋ שיחה חדשה</button><button class="side-action" id="searchChats">⌕ חיפוש שיחות</button>
  <div class="history-title">השיחות האחרונות</div><div class="history" id="historyList"></div>
  <div class="profile-wrap"><button class="profile" id="profileOpen"><span class="profile-avatar">R</span><span class="profile-name"><b>Retzef AI</b><small>Retzef test 1.0 · בפיתוח</small></span><span class="profile-more">•••</span></button></div>
 </aside>
 <div class="shade" id="shade"></div>
 <main class="main">
  <header class="topbar"><button class="icon-btn menu-btn" id="openSide">☰</button><div class="mobile-brand">Retzef AI</div><div class="top-left">Retzef AI <span class="chevron">⌄</span></div><button class="share-btn" id="shareBtn">↗ שתף</button></header>
  <section class="chat-area" id="chatArea"><div class="welcome" id="welcome"><div class="welcome-mark">R</div><h1>במה אפשר לעזור?</h1></div><div class="messages" id="messages"></div></section>
  <footer class="composer-zone"><div class="composer"><button class="plus-btn" id="attachBtn">＋</button><textarea id="messageInput" rows="1" placeholder="שאלו את Retzef AI"></textarea><button class="mic-btn" id="micBtn">♩</button><button class="send-btn" id="sendBtn" disabled>↑</button></div><div class="composer-disclaimer">Retzef AI עדיין בפיתוח. המודל העצמאי טרם חובר.</div></footer>
 </main>
</div>
<section class="settings-screen" id="settingsScreen" hidden>
 <header class="settings-top"><button class="back-btn" id="settingsBack" aria-label="חזרה">→</button><span id="settingsTopTitle">החשבון שלי</span><span class="top-spacer"></span></header>
 <div class="settings-scroll" id="settingsScroll">
  <div class="profile-hero"><div class="large-avatar">R<button class="edit-avatar" aria-label="עריכת תמונה">✎</button></div><h1>Retzef AI</h1><p>החשבון שלך ב־Retzef</p></div>
  <div class="settings-content" id="settingsContent">
   <h2>My Retzef AI</h2>
   <div class="settings-group">
    <button class="setting-row" data-page="personalization"><span class="row-icon">☻</span><span>Personalization<small>התאמה אישית של Retzef AI</small></span><b>‹</b></button>
    <button class="setting-row" data-page="memory"><span class="row-icon">▤</span><span>Memory<small>זיכרונות והעדפות</small></span><b>‹</b></button>
    <button class="setting-row" data-page="plugins"><span class="row-icon">⠿</span><span>Plugins<small>חיבורים וכלים</small></span><b>‹</b></button>
   </div>
   <h2>Account</h2>
   <div class="settings-group">
    <button class="setting-row" data-page="workspace"><span class="row-icon">▢</span><span>Workspace<small>Personal</small></span><b>‹</b></button>
    <button class="setting-row accent-row" data-page="plan"><span class="row-icon">✧</span><span>Upgrade plan<small>תוכניות ושדרוגים</small></span><b>‹</b></button>
    <button class="setting-row" data-page="usage"><span class="row-icon">▥</span><span>Usage and limits<small>שימוש ומגבלות</small></span><b>‹</b></button>
    <button class="setting-row" data-page="parental"><span class="row-icon">♡</span><span>Parental controls<small>הגדרות בטיחות משפחתיות</small></span><b>‹</b></button>
    <button class="setting-row" data-page="email"><span class="row-icon">✉</span><span>Email<small>לא הוגדרה כתובת באתר</small></span><b>‹</b></button>
    <button class="setting-row" data-page="age"><span class="row-icon">♙</span><span>Age<small>הגדרות גיל</small></span><b>‹</b></button>
   </div>
   <div class="settings-group"><button class="setting-row" id="logoutBtn" type="button"><span class="row-icon">⇥</span><span>Log out<small>התנתקות מחשבון Retzef AI</small></span><b>‹</b></button></div>
   <h2>App</h2>
   <div class="settings-group"><button class="setting-row" data-page="appearance"><span class="row-icon">◐</span><span>Appearance<small>ערכת נושא ותצוגה</small></span><b>‹</b></button><button class="setting-row" data-page="language"><span class="row-icon">文</span><span>Language<small>שפת הממשק</small></span><b>‹</b></button><button class="setting-row" data-page="about"><span class="row-icon">ⓘ</span><span>About Retzef AI<small>גרסה ומידע</small></span><b>‹</b></button></div>
   <div class="settings-search"><span>⌕</span><input id="settingsSearch" placeholder="Search settings / חיפוש בהגדרות"></div>
  </div>
  <div class="subpage" id="subpage" hidden></div>
 </div>
</section>
<div class="toast" id="toast"></div>

<section class="auth-screen" id="authScreen" hidden>
 <div class="auth-card">
  <div class="auth-logo">R</div>
  <h1>Retzef AI</h1>
  <p class="auth-subtitle" id="authSubtitle">התחבר לחשבון שלך כדי לשמור שיחות בענן</p>
  <div class="auth-tabs"><button type="button" id="loginTab" class="active">Login</button><button type="button" id="registerTab">Sign Up</button></div>
  <form id="authForm">
   <label for="authUsername">Username</label><input id="authUsername" name="username" autocomplete="username" minlength="3" maxlength="24" required placeholder="שם משתמש">
   <label for="authPassword">Password</label><input id="authPassword" name="password" type="password" autocomplete="current-password" minlength="10" maxlength="128" required placeholder="סיסמה">
   <div id="confirmWrap" hidden><label for="authConfirm">Confirm password</label><input id="authConfirm" type="password" autocomplete="new-password" minlength="10" maxlength="128" placeholder="אימות סיסמה"></div>
   <p class="auth-error" id="authError" role="alert"></p>
   <button class="auth-submit" id="authSubmit" type="submit">Login</button>
  </form>
  <small class="auth-note">הסיסמה נשמרת כ־Hash מאובטח. אל תשתף אותה עם אף אחד.</small>
 </div>
</section>

<script src="/account.js" defer></script><script src="/app.js" defer></script>
</body></html>
