<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Retzef AI — העוזר החכם שאנחנו בונים.">
  <title>Retzef AI</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="app">
    <section class="conversation" id="conversation" aria-live="polite">
      <div class="messages" id="messages"></div>
      <div class="quick-actions" id="quickActions">
        <button class="quick-action" data-prompt="אני רוצה ליצור תמונה: "><span>Create an image</span><span class="action-icon image-icon">▧</span></button>
        <button class="quick-action" data-prompt="עזור לי לכתוב או לערוך: "><span>Write or edit</span><span class="action-icon">✎</span></button>
        <button class="quick-action" data-prompt="חפש מידע באינטרנט על: "><span>Search the web</span><span class="action-icon globe">◎</span></button>
      </div>
    </section>

    <footer class="composer-area">
      <div class="composer">
        <button class="round-tool voice-tool" id="voiceButton" aria-label="מצב קול"><span class="wave">▮</span></button>
        <button class="mic-tool" id="micButton" aria-label="הקלטת הודעה"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2.5" width="6" height="13" rx="3"></rect><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5M9 21.5h6"></path></svg></button>
        <textarea id="messageInput" rows="1" placeholder="Ask Retzef AI" aria-label="הודעה ל-Retzef AI"></textarea>
        <button class="plus-tool" id="plusButton" aria-label="כלים נוספים">＋</button>
      </div>
      <div class="tool-popover" id="toolPopover" hidden>אפשרויות נוספות יתווספו בהמשך</div>
      <div class="disclaimer" id="disclaimer">Retzef AI · Retzef test 1.0 עדיין בפיתוח</div>
    </footer>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
